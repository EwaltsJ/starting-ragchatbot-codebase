[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "black>=25.1.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "live: makes real network calls to the Anthropic API and/or reads the real chroma_db data",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 (line too long) is left to black, which does not wrap string literals
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py intentionally suppresses a warning before importing the modules that trigger it
"backend/app.py" = ["E402"]
